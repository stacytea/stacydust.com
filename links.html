<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="logo.png" type="image/png">
  <link rel="apple-touch-icon" href="logo.png">
  <meta property="og:title" content="外部連結 · 星塵實驗室" />
  <meta property="og:description" content="茶比樂的社群連結總覽" />
  <meta property="og:url" content="https://stacydust.com/links.html" />

  <link rel="stylesheet" href="style.css">
  <style>
    .links-wrap {
      max-width: 420px;
      margin: 0 auto;
    }

    .link-group {
      margin-bottom: 2rem;
    }

    .link-group-label {
      font-size: 9.5px;
      letter-spacing: 0.28em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .link-group-label::after {
      content: '';
      flex: 1;
      height: 0.5px;
      background: var(--border);
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0.95rem 1.2rem;
      margin-bottom: 0.6rem;
      border: 0.5px solid var(--green-border);
      border-radius: 4px;
      background: var(--card-bg);
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      overflow: hidden;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, var(--green-mid), var(--green-light));
      opacity: 0;
      transition: opacity 0.2s;
    }

    .link-btn.og::before {
      background: linear-gradient(to bottom, var(--orange), #e09a5a);
    }

    .link-btn:hover {
      border-color: rgba(90,150,135,0.45);
      background: rgba(255,255,255,0.85);
    }

    .link-btn:hover::before { opacity: 1; }

    .link-btn-left {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }

    .link-platform {
      font-size: 9px;
      letter-spacing: 0.18em;
      color: var(--green);
      text-transform: uppercase;
      min-width: 58px;
    }

    .link-btn.og .link-platform {
      color: var(--orange);
    }

    .link-name {
      font-size: 12.5px;
      letter-spacing: 0.06em;
      color: var(--text);
    }

    .link-arrow {
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.5;
    }
  </style>
</head>
<body>

    <a class="site-logo" href="index.html">

    <nav>

        <li><a href="works.html">作品集</a></li>
        <li><a href="booth.html">活動紀錄</a></li>
        <li><a href="links.html" class="active">外部連結</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <span class="eyebrow">links</span>
    <h1>外部<em>連結</em></h1>

    <p>茶比樂活躍的平台總覽，歡迎追蹤 👋</p>

    <div class="divider">

    <div class="links-wrap">

      <!-- 社群平台 -->
      <div class="link-group">

        <!-- 把 href 換成你的實際連結，link-name 換成你的帳號名稱 -->

            <span class="link-platform">Twitter</span>

          </div>
          <span class="link-arrow">↗</span>
        </a>

        <a href="https://www.instagram.com/" target="_blank" rel="noopener" class="link-btn">

            <span class="link-platform">Instagram</span>
